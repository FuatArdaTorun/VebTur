server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # The API lives in its own container. Proxying it here keeps the browser on a single origin,
    # so the production build needs no CORS setup and calls the API with relative URLs.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The production build puts a content hash in every JS and CSS file name, so a changed file
    # always gets a new URL and these can be cached for a long time. Images such as logo.png keep
    # a fixed name, so they use normal caching.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Angular handles routing in the browser, so any other path falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
