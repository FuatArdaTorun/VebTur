<section class="favorite-list">
  <h1>My Favorites</h1>

  @if (loading()) {
    <app-loading-state message="Loading your favorites…" />
  } @else if (error()) {
    <app-error-state message="Could not load your favorites. Please try again later." />
  } @else if (hotels().length === 0) {
    <app-empty-state message="You haven't favorited any hotels yet — tap the heart on a hotel to save it here." />
  } @else {
    <div class="favorite-list__grid">
      @for (hotel of hotels(); track hotel.id) {
        <app-hotel-card [hotel]="hotel" [showFavorite]="true" [favorited]="true" (favoriteToggle)="removeFavorite(hotel.id)" />
      }
    </div>

    @if (totalPages() > 1) {
      <nav class="favorite-list__pagination" aria-label="Pagination">
        <button type="button" [disabled]="page() <= 1" (click)="goToPage(page() - 1)">← Previous</button>
        <span>Page {{ page() }} of {{ totalPages() }}</span>
        <button type="button" [disabled]="page() >= totalPages()" (click)="goToPage(page() + 1)">Next →</button>
      </nav>
    }
  }
</section>
