<div class="admin-dashboard">
  <h1 class="admin-dashboard__title">Dashboard</h1>

  @if (loading()) {
    <app-loading-state message="Loading dashboard…" />
  } @else if (error()) {
    <app-error-state message="Could not load the dashboard summary. Please try again." />
  } @else if (summary(); as s) {
    <div class="admin-dashboard__grid">
      <a
        class="stat-tile stat-tile--actionable"
        routerLink="/admin/reservations"
        [queryParams]="{ status: 'AwaitingApproval' }"
      >
        <svg class="stat-tile__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5" stroke-linecap="round" stroke-linejoin="round" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 7.5V12l3 2" />
        </svg>
        <span class="stat-tile__value">{{ s.awaitingApprovalReservationsCount }}</span>
        <span class="stat-tile__label">Awaiting approval</span>
      </a>

      <a class="stat-tile stat-tile--actionable" routerLink="/admin/support-messages">
        <svg class="stat-tile__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="3.5" y="5.5" width="17" height="13" rx="2" stroke-linecap="round" stroke-linejoin="round" />
          <path stroke-linecap="round" stroke-linejoin="round" d="m4 6.5 8 6.5 8-6.5" />
        </svg>
        <span class="stat-tile__value">{{ s.newSupportMessagesCount }}</span>
        <span class="stat-tile__label">New support messages</span>
      </a>

      <a class="stat-tile" routerLink="/admin/hotels">
        <svg class="stat-tile__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="3.5" y="4" width="17" height="17" rx="2" stroke-linecap="round" stroke-linejoin="round" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 8.5h1.5M14.5 8.5H16M8 12.5h1.5M14.5 12.5H16M8 16.5h1.5M14.5 16.5H16" />
        </svg>
        <span class="stat-tile__value">{{ s.activeHotelsCount }}</span>
        <span class="stat-tile__label">Active hotels</span>
      </a>

      <a class="stat-tile" routerLink="/admin/reviews">
        <svg class="stat-tile__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m12 4 2.35 4.76 5.25.76-3.8 3.7.9 5.24L12 16l-4.7 2.46.9-5.24-3.8-3.7 5.25-.76L12 4Z"
          />
        </svg>
        <span class="stat-tile__value">{{ s.totalReviewsCount }}</span>
        <span class="stat-tile__label">Total reviews</span>
      </a>
    </div>
  }
</div>
