<div class="admin-shell">
  <aside class="admin-shell__sidebar">
    <a class="admin-shell__brand" routerLink="/">
      <img class="admin-shell__logo" src="/logo.png" alt="VebTur logo">
      VebTur Admin
    </a>
    <nav class="admin-shell__nav">
      <a routerLink="/admin/hotels" routerLinkActive="admin-shell__link--active">Hotels</a>
      <a routerLink="/admin/reservations" routerLinkActive="admin-shell__link--active">Reservations</a>
      <a routerLink="/admin/amenities" routerLinkActive="admin-shell__link--active">Amenities</a>
      <a routerLink="/admin/notifications" routerLinkActive="admin-shell__link--active">Notifications</a>
      <a routerLink="/admin/reviews" routerLinkActive="admin-shell__link--active">Reviews</a>
      <a routerLink="/admin/support-messages" routerLinkActive="admin-shell__link--active">Support Messages</a>
    </nav>
    <div class="admin-shell__user">
      @if (currentUser(); as user) {
        <span class="admin-shell__user-name">{{ user.displayName }}</span>
      }
      <button type="button" class="admin-shell__logout" (click)="logout()">Log out</button>
    </div>
  </aside>
  <main class="admin-shell__content">
    <div class="admin-shell__topbar">
      <app-notification-bell
        [items]="pendingApprovals()"
        storageKey="admin-pending-approvals"
        emptyMessage="No reservations awaiting approval."
        ariaLabel="Reservations awaiting approval"
        (opened)="fetchPendingApprovals()"
      />
    </div>
    <router-outlet />
  </main>
</div>
