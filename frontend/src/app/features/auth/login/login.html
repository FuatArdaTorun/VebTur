<app-auth-layout>
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Sign In</h1>
    <p class="auth-form__subtitle">Welcome back — sign in to manage your reservations.</p>

    <label>
      Email or username
      <input type="text" formControlName="emailOrUsername" autocomplete="username" />
    </label>

    <label>
      Password
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>

    <a class="auth-form__forgot-password" routerLink="/forgot-password">Forgot password?</a>

    @if (error()) {
      <p class="auth-form__error">Invalid email/username or password.</p>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Signing in…' : 'Sign In' }}
    </button>

    <p class="auth-form__switch">Don't have an account? <a routerLink="/register">Sign Up</a></p>
  </form>
</app-auth-layout>
