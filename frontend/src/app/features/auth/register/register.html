<app-auth-layout>
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Sign Up</h1>
    <p class="auth-form__subtitle">Create an account to request reservations and track their status.</p>

    <label>
      Full name
      <input type="text" formControlName="displayName" autocomplete="name" />
    </label>

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="username" />
    </label>

    <label>
      Password
      <input type="password" formControlName="password" autocomplete="new-password" />
    </label>
    <p class="auth-form__hint">At least 8 characters, with an uppercase letter, a lowercase letter, and a number.</p>

    @if (error(); as message) {
      <p class="auth-form__error">{{ message }}</p>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Creating account…' : 'Sign Up' }}
    </button>

    <p class="auth-form__switch">Already have an account? <a routerLink="/login">Sign In</a></p>
  </form>
</app-auth-layout>
