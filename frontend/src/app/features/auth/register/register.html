<div class="register">
  <form class="register__form" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Sign Up</h1>

    <label>
      Full name
      <input type="text" formControlName="displayName" autocomplete="name" />
    </label>

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="username" />
    </label>

    <label>
      Password
      <input type="password" formControlName="password" autocomplete="new-password" />
    </label>

    @if (error(); as message) {
      <p class="register__error">{{ message }}</p>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Creating account…' : 'Sign Up' }}
    </button>

    <p class="register__switch">Already have an account? <a routerLink="/login">Sign In</a></p>
  </form>
</div>
