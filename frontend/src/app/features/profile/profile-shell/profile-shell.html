<div class="account">
  <aside class="account__sidebar">
    <a class="account__brand" routerLink="/">
      <img class="account__logo" src="/logo.png" alt="VebTur logo">
      {{ displayName() }}
    </a>

    <nav class="account__nav">
      <span class="account__nav-label">Account</span>

      <a
        class="account__nav-link"
        routerLink="/profile"
        routerLinkActive="account__nav-link--active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="12" cy="8" r="3.25" stroke-linecap="round" stroke-linejoin="round" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 19.5c0-3.6 3.13-6.5 7-6.5s7 2.9 7 6.5" />
        </svg>
        Personal Info
      </a>

      <a class="account__nav-link" routerLink="/profile/security" routerLinkActive="account__nav-link--active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="5" y="11" width="14" height="9" rx="2" stroke-linecap="round" stroke-linejoin="round" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 11V7.5a4 4 0 0 1 8 0V11" />
        </svg>
        Account Security
      </a>

      @if (isAdmin()) {
        <span class="account__nav-label">Management</span>

        <a class="account__nav-link" routerLink="/admin/hotels">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="3.5" y="4" width="17" height="13" rx="2" stroke-linecap="round" stroke-linejoin="round" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 20.5h8M12 17v3.5" />
          </svg>
          Admin Panel
        </a>
      } @else {
        <span class="account__nav-label">Travel</span>

        <a class="account__nav-link" routerLink="/favorites" routerLinkActive="account__nav-link--active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 20.5s-7.5-4.6-10-9.3C.5 8 2 4.5 5.6 4c2.2-.3 4.2.8 6.4 3 2.2-2.2 4.2-3.3 6.4-3 3.6.5 5.1 4 3.6 7.2-2.5 4.7-10 9.3-10 9.3Z" />
          </svg>
          My Favorites
        </a>

        <a class="account__nav-link" routerLink="/my-reservations" routerLinkActive="account__nav-link--active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="3" y="8" width="18" height="11" rx="2" stroke-linecap="round" stroke-linejoin="round" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.5 8V6.5a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2V8" />
          </svg>
          My Reservations
        </a>
      }
    </nav>

    <button type="button" class="account__logout" (click)="logout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.5 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7.5a2 2 0 0 0 2-2v-2" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h11.5m0 0-3-3m3 3-3 3" />
      </svg>
      Log out
    </button>
  </aside>

  <main class="account__content">
    <router-outlet />
  </main>
</div>
