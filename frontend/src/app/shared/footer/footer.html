<footer class="footer">
  <div class="footer__bar">
    <div class="footer__brand">
      <img class="footer__logo" src="/logo.png" alt="VebTur logo" />
      <span>VebTur</span>
    </div>

    <ul class="footer__highlights">
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3.5c4 1.3 7 1.5 7 1.5v6.2c0 4.4-3 7.4-7 9.3-4-1.9-7-4.9-7-9.3V5c0 0 3-.2 7-1.5Z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="m9 12 2.2 2.2L15.5 10" />
        </svg>
        <span>Verified Hotels</span>
      </li>

      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20 12.4 12.6 19.8a2 2 0 0 1-2.8 0L4.2 14.2a2 2 0 0 1 0-2.8L11.6 4H18a2 2 0 0 1 2 2v6.4Z" />
          <circle cx="15" cy="9" r="1.4" />
        </svg>
        <span>Transparent Pricing</span>
      </li>

      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M7 3.5h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-16a1 1 0 0 1 1-1Z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="m9 13.5 2.2 2.2L15.5 11" />
        </svg>
        <span>Free to Request</span>
      </li>
    </ul>
  </div>

  <div class="footer__contact-bar">
    <div class="footer__contact">
      <span class="footer__contact-label">Contact Us</span>

      <!-- Placeholder links by design: they give the bar the look of a real contact section but
           deliberately lead nowhere (href="#", with the click cancelled so the page doesn't jump to
           the top). VebTur is a demo, so it never sends visitors to a real company's website, app,
           or WhatsApp number. A "Demo link" tooltip on hover/focus (data-tooltip, drawn in
           footer.scss) and a screen-reader description (aria-describedby) say so, so a dead click
           doesn't read as a broken site. -->
      <ul class="footer__contact-links">
        <li>
          <a
            class="footer__contact-link"
            href="#"
            data-tooltip="Demo link"
            aria-describedby="footer-demo-note"
            (click)="$event.preventDefault()"
          >
            <svg class="footer__contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5" />
              <path stroke-linecap="round" d="M3.7 12h16.6" />
              <path stroke-linecap="round" d="M12 3.5c2.3 2.3 3.5 5.3 3.5 8.5s-1.2 6.2-3.5 8.5c-2.3-2.3-3.5-5.3-3.5-8.5S9.7 5.8 12 3.5Z" />
            </svg>
            <span>Our Website</span>
          </a>
        </li>

        <li>
          <a
            class="footer__contact-link"
            href="#"
            data-tooltip="Demo link"
            aria-describedby="footer-demo-note"
            (click)="$event.preventDefault()"
          >
            <svg class="footer__contact-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 3.3c-.4.2-.7.7-.7 1.3v14.8c0 .6.3 1.1.7 1.3l9.9-8.7L5 3.3Z" fill="#00D3FF" />
              <path d="M14.9 12l3.6-3.2 3.9 2.3c.7.4.7 1.4 0 1.8l-3.9 2.3-3.6-3.2Z" fill="#FFD500" />
              <path d="M14.9 12 5 20.7c.2.1.4.2.6.2.2 0 .5-.1.7-.2l12.2-7.1-3.6-1.6Z" fill="#FF3A44" />
              <path d="M14.9 12 18.5 8.8 6.3 1.7c-.2-.1-.5-.2-.7-.2-.2 0-.4.1-.6.2L14.9 12Z" fill="#00F076" />
            </svg>
            <span>Get the App</span>
          </a>
        </li>

        <li>
          <a
            class="footer__contact-link"
            href="#"
            data-tooltip="Demo link"
            aria-describedby="footer-demo-note"
            (click)="$event.preventDefault()"
          >
            <svg class="footer__contact-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="11" fill="#25D366" />
              <path
                fill="#fff"
                d="M16.7 13.6c-.3-.1-1.6-.8-1.9-.9-.2-.1-.4-.1-.6.1-.2.3-.7.9-.8 1-.2.2-.3.2-.5.1-.3-.1-1.1-.4-2.1-1.3-.8-.7-1.3-1.6-1.4-1.8-.2-.3 0-.4.1-.6l.4-.4c.1-.1.2-.3.2-.4.1-.2 0-.3 0-.4l-.7-1.7c-.2-.4-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s1 2.5 1.1 2.7c.1.2 2 3 4.8 4.2.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.6-.7 1.9-1.3.2-.6.2-1.1.2-1.2 0-.1-.2-.2-.4-.3Z"
              />
            </svg>
            <span>WhatsApp</span>
          </a>
        </li>
      </ul>
      <span id="footer-demo-note" hidden>Demo link</span>
    </div>
  </div>
</footer>
