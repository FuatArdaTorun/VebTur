<div class="notification-bell">
  <button
    type="button"
    class="notification-bell__trigger"
    [attr.aria-label]="ariaLabel()"
    [class.notification-bell__trigger--active]="unreadCount() > 0"
    (click)="toggle()"
  >
    🔔
    @if (unreadCount() > 0) {
      <span class="notification-bell__badge">{{ unreadCount() }}</span>
    }
  </button>

  @if (isOpen()) {
    <div class="notification-bell__dropdown">
      @if (visibleItems().length === 0) {
        <p class="notification-bell__empty">{{ emptyMessage() }}</p>
      } @else {
        @for (item of visibleItems(); track item.id) {
          <div class="notification-bell__item">
            <a
              class="notification-bell__item-link"
              [routerLink]="item.routerLink"
              (click)="dismiss(item.id); close()"
            >
              <span class="notification-bell__item-title">{{ item.title }}</span>
              @if (item.subtitle) {
                <span class="notification-bell__item-subtitle">{{ item.subtitle }}</span>
              }
            </a>
            <button
              type="button"
              class="notification-bell__dismiss"
              aria-label="Dismiss notification"
              title="Dismiss"
              (click)="dismiss(item.id)"
            >
              ✕
            </button>
          </div>
        }
      }
    </div>
  }
</div>
