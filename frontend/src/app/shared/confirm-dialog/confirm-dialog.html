<div class="confirm-dialog__backdrop" (click)="cancelled.emit()">
  <div class="confirm-dialog" (click)="$event.stopPropagation()">
    <p>{{ message() }}</p>
    <div class="confirm-dialog__actions">
      <button type="button" (click)="cancelled.emit()">{{ cancelLabel() }}</button>
      <button type="button" class="confirm-dialog__confirm" (click)="confirmed.emit()">{{ confirmLabel() }}</button>
    </div>
  </div>
</div>
